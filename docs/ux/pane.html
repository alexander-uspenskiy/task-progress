<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agents pane: before and after</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
 body { padding:22px 26px 30px; }
 .cols { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
 .col { border-radius:12px; padding:12px 14px 14px; border:1px solid var(--rule); min-height:760px; }
 .crop { overflow:hidden; border-radius:8px; height:700px; }
 .crop img { margin-left:0; margin-top:-80px; zoom:.8; max-width:none !important; }
 .tty { font-size:12px; line-height:1.38; }
 .col h3 { margin:0 0 4px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }
 .rail { color:var(--c1); } .railb { color:var(--info); } .raild { color:var(--rule2); }
 .pip { letter-spacing:-1px; }
</style></head>
<body>
<h1>The Agents pane: real capture vs proposal</h1>
<p class="lead">Dark theme on the left pair, light theme on the right pair. "Before" is a real screenshot of v0.4.2 (cropped to the pane, 80 % scale). "After" is a mock-up on a monospace cell grid at the same 34 to 42 column width.</p>
<div class="cols" id="root"></div>
<script>
const pad = (s, n) => String(s).padStart(n);
const bar = (n, of, cls) => '<span class="' + cls + '">' + '▇'.repeat(n) + '</span><span class="d">' + '▁'.repeat(of - n) + '</span>';
const pips = (k) => '<span class="info pip">' + '▮'.repeat(k) + '</span><span class="d pip">' + '▯'.repeat(4 - k) + '</span>';
function after() {
  const r = (c, t) => `<span class="${c}">${t}</span>`;
  return `<div class="tty">
<span class="hdr">◢ AGENTS</span> <span class="sep">───────────────────</span> <span class="ok">●</span> <span class="m">1 running</span>

<span class="d b">TOKENS</span>${' '.repeat(16)}<span class="d">in</span>${' '.repeat(5)}<span class="d">out</span>${' '.repeat(5)}<span class="d">cost</span>
 <span class="m">session  </span>${' '.repeat(10)}<span class="t">3.2M</span>${' '.repeat(2)}<span class="t">7.5k</span>  <span class="costchip">$0.60</span>
 <span class="m">this turn</span>${' '.repeat(10)}<span class="t">3.2M</span>${' '.repeat(2)}<span class="t">7.5k</span>  <span class="costchip">$0.60</span>
 <span class="m">cache hit</span> ${bar(9, 10, 'info')} <span class="t">97%</span>

<div class="card"><span class="b cl">◆ Main agent</span>${' '.repeat(12)}<span class="chip ok b">● RUNNING</span>
<span class="info">sonnet-5-5</span> ${pips(3)} <span class="info">high</span>
<span class="t">3.2M</span> tok <span class="d">·</span> <span class="costchip">$0.60</span> <span class="d">·</span> 36 calls <span class="d">·</span> <span class="err b">3 ✗</span>
<span class="m">Screenshot</span> ${bar(9, 9, 'cl')} <span class="t">9</span> <span class="d">windows-mcp</span>
<span class="m">ToolSearch</span> ${bar(5, 9, 'cl')} <span class="t">5</span>
<span class="m">Click     </span> ${bar(5, 9, 'cl')} <span class="t">5</span> <span class="d">windows-mcp</span>
<span class="m">Read      </span> ${bar(4, 9, 'cl')} <span class="t">4</span>
<span class="d">+ 6 more tools</span>
<span class="ok">✓</span> <span class="t">Write</span> <span class="d">…/scratchpad/cap.ps1</span>${pad('100ms', 8)}
<span class="ok">✓</span> <span class="t">Click</span>${pad('3.4s', 29)}
<span class="err">✗</span> <span class="t">Screenshot</span> <span class="err">user control</span>${pad('0.4s', 10)}
<span class="cl">◐</span> <span class="t">PowerShell</span> <span class="cl">▂▃▅▆</span>${pad('12s', 17)}</div>
<span class="d b">SUBAGENTS</span> <span class="d">2 total</span> <span class="sep">·</span> <span class="cl">◐ 1 running</span>
<div class="card sub"><span class="b info">◈ Explore</span> <span class="m">find hooks</span>${' '.repeat(7)}<span class="cl">◐ 0:14</span>
<span class="d">a1b2c3d4</span> <span class="info">haiku-5-5</span> ${pips(1)} <span class="info">low</span>
<span class="t">101k</span> tok <span class="d">·</span> <span class="costchip">$0.03</span> <span class="d">·</span> 5 calls
<span class="ok">✓</span> <span class="t">Grep</span> <span class="d">register</span>${pad('0.3s', 24)}</div>
<span class="d b">HISTORY</span> <span class="d">2 finished · 305k tok ·</span> <span class="costchip">$0.12</span>
<span class="ok">✓</span> <span class="m">▣ Tester  </span> <span class="info">sonnet</span> ${pad('203k', 6)} ${pad('$0.09', 6)} ${pad('1m05', 5)}
<span class="ok">✓</span> <span class="m">◉ Reviewer</span> <span class="info">sonnet</span> ${pad('101k', 6)} ${pad('$0.03', 6)} ${pad('0:05', 5)}

<span class="d">ⓘ 27/27 requests · 22 prices</span>
</div>`;
}
const col = (cls, label, inner) => `<section class="col ${cls}"><h3 style="color:var(--muted)">${label}</h3>${inner}</section>`;
const before = (t) => `<div class="tag before">Before · real capture</div><div class="crop"><img src="shots/${t}-pane.png" alt="${t} pane"></div>`;
const aft = `<div class="tag after">After · mock-up</div>`;
document.getElementById('root').innerHTML =
  col('dark', 'Dark', before('dark')) + col('dark', 'Dark', aft + after()) +
  col('light', 'Light', before('light')) + col('light', 'Light', aft + after());
</script></body></html>
